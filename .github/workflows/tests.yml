name: RailOpt Automated Tests & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Demo Database
        run: |
          python scripts/seed_demo_data.py

      - name: Run Core Optimization Tests
        run: |
          pytest tests/test_optimizer.py -v

      - name: Run RBAC & Security Tests
        run: |
          pytest tests/test_rbac_p13.py -v

      - name: Run What-If Simulation Tests
        run: |
          pytest tests/test_whatif_p12.py -v

      - name: Run AI Architecture Tests
        run: |
          pytest tests/test_ai_architecture.py -v

      - name: Run Cloud Compatibility Tests
        run: |
          pytest tests/test_serverless_compatibility.py -v
