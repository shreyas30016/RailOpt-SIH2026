[project]
name = "railopt"
version = "1.0.0"
description = "Deterministic Railway Block Planning and Optimization Engine for Indian Railways"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "ortools>=9.9.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
